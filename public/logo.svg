<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <!-- Logo icon - two intertwined arrows in a circle -->
  <g transform="translate(60, 60)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#1E4D7B" stroke-width="3"/>
    
    <!-- Teal arrow going up-right -->
    <path d="M -15 15 Q -5 -15 20 -25" fill="none" stroke="#0A6E5C" stroke-width="4" stroke-linecap="round"/>
    <polygon points="20,-25 12,-18 22,-16" fill="#0A6E5C"/>
    
    <!-- Orange arrow going down-left -->
    <path d="M 15 -15 Q 5 15 -20 25" fill="none" stroke="#E87722" stroke-width="4" stroke-linecap="round"/>
    <polygon points="-20,25 -12,18 -22,16" fill="#E87722"/>
  </g>
  
  <!-- Text -->
  <text x="120" y="55" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="bold" fill="#1E3A5F" letter-spacing="2">TRADEFLOW</text>
  <text x="120" y="85" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280" letter-spacing="3">GLOBAL TRADE SOLUTIONS</text>
</svg>
